server:
  port: 8080

spring:
  application:
    name: Itaú Challenge

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

  output:
    ansi:
      enabled: always

  main:
    banner: off

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-in-seconds: ${JWT_EXPIRATION_SECONDS}